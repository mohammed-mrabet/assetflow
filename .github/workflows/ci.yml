name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: assetflow
          POSTGRES_USER: assetflow
          POSTGRES_PASSWORD: assetflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/assetflow
      DB_USER: assetflow
      DB_PASSWORD: assetflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests unitaires, tests d'intégration (PostgreSQL + Flyway) et packaging
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-de-tests
          path: |
            target/surefire-reports/
            target/failsafe-reports/
